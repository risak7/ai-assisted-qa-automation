name: Test generation

on:
  # schedule:
  #   # 06:00 UTC, Monday–Friday
  #   - cron: "0 6 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      DIDAXIS_URL: ${{ secrets.DIDAXIS_URL }}
      DIDAXIS_EMAIL: ${{ secrets.DIDAXIS_EMAIL }}
      DIDAXIS_PASSWORD: ${{ secrets.DIDAXIS_PASSWORD }}
      DIDAXIS_API_TOKEN: ${{ secrets.DIDAXIS_API_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Install Cursor CLI
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify Jira API credentials
        env:
          ATLASSIAN_EMAIL: ${{ secrets.ATLASSIAN_EMAIL }}
          ATLASSIAN_API_TOKEN: ${{ secrets.ATLASSIAN_API_TOKEN }}
        run: |
          code="$(curl -s -o /dev/null -w '%{http_code}' \
            -u "${ATLASSIAN_EMAIL}:${ATLASSIAN_API_TOKEN}" \
            "https://legionqaschool.atlassian.net/rest/api/3/myself")"
          if [ "$code" != "200" ]; then
            echo "::error::Jira REST auth failed (HTTP ${code}). Use ATLASSIAN_EMAIL + API token, not account password."
            exit 1
          fi

      - name: Check backlog queue
        id: queue
        env:
          ATLASSIAN_EMAIL: ${{ secrets.ATLASSIAN_EMAIL }}
          ATLASSIAN_API_TOKEN: ${{ secrets.ATLASSIAN_API_TOKEN }}
        run: |
          jql='project = DS AND status = "In Progress" AND summary ~ "\\[Raya +" AND (labels is EMPTY OR labels not in (tests-generated)) ORDER BY key ASC'
          total="$(curl -sf -u "${ATLASSIAN_EMAIL}:${ATLASSIAN_API_TOKEN}" \
            -H "Accept: application/json" \
            -G "https://legionqaschool.atlassian.net/rest/api/3/search" \
            --data-urlencode "jql=${jql}" \
            --data-urlencode "maxResults=0" \
            | jq -r '.total // 0')"
          echo "count=${total}" >> "$GITHUB_OUTPUT"
          echo "Eligible backlog tickets: ${total}"

      - name: Work the In Progress backlog
        if: ${{ steps.queue.outputs.count != '0' }}
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          ATLASSIAN_EMAIL: ${{ secrets.ATLASSIAN_EMAIL }}
          ATLASSIAN_API_TOKEN: ${{ secrets.ATLASSIAN_API_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          agent -p --force --trust --output-format text "$(cat <<'EOF'
          Backlog mode. This workflow is the external trigger. Follow .cursor/rules/qa-orchestration.mdc.

          Work DS tickets in status "In Progress", title starting with "[Raya +", without the tests-generated label. Take at most 5 tickets, lowest key first.

          For each ticket:
          1. Analyze the ticket, including live UI recon when DIDAXIS_EMAIL and DIDAXIS_PASSWORD are set.
          2. Write a conforming Playwright spec under tests/. Page objects and fixtures only under pages/ and fixtures/. Do not edit application source.
          3. Run that spec with npx playwright test. On red, Heal on red (triage then .cursor/skills/self-heal/SKILL.md) before opening the PR; at most 5 heals total this workflow run.
          4. If the same spec fails the same way again after heal, stop that ticket and move on. Do not retry it.
          5. Open one pull request linked to the ticket. Put the DS key in the title and body.
          6. Add the tests-generated label on the Jira ticket so the next run skips it.

          Never merge a pull request. Never close or transition the ticket. A human approves every merge and every filed bug.

          Use ATLASSIAN_EMAIL with ATLASSIAN_API_TOKEN for Jira (API token auth). Use GITHUB_TOKEN for git and pull requests.
          EOF
          )"

      - name: Self-heal suite (no backlog tickets)
        if: ${{ steps.queue.outputs.count == '0' }}
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          agent -p --force --trust --output-format text "$(cat <<'EOF'
          No eligible DS backlog tickets (In Progress, title "[Raya +", no tests-generated label). Follow .cursor/rules/qa-orchestration.mdc Heal on red and .cursor/skills/self-heal/SKILL.md.

          Run npx playwright test. If the suite is green, report that the queue is empty and the suite is green; exit 0.

          If red: triage each functional failure. For locator drift, self-heal one POM locator per failure (max 5 heals this run). Re-run each affected spec with assertions unchanged (git diff -- tests/ must stay empty). Open one heal/ pull request per repair linked to this workflow run. Never merge.

          On product defect, environment or flake, or copy or timestamp drift: stop and report; do not heal. Informational a11y findings are not a red run — report and continue.

          Use GITHUB_TOKEN for git and pull requests.
          EOF
          )"

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Suite reliability eval report
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run eval:report -- --trigger=test-generation --ci-runs=30

      - name: Commit eval report
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eval-report.md .eval/telemetry.json 2>/dev/null || git add eval-report.md
          git diff --staged --quiet || git commit -m "chore: refresh suite reliability eval report"
          git push
